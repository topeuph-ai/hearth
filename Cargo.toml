[workspace]
members = ["dnas/*/zomes/coordinator/*", "dnas/*/zomes/integrity/*"]
resolver = "2"
# The test crate builds natively, not to wasm, so it is not a member here.
exclude = ["tests"]

[workspace.dependencies]
# Pinned to the Holochain 0.7.0 release line.
# Verified from crates/hdk/Cargo.toml and crates/hdi/Cargo.toml at tag holochain-0.7.0.
hdi = "=0.8.0"
hdk = { version = "=0.7.0", features = ["properties"] }
# Clone modifiers arrive as YAML, which is why the founder is a base64 string.
yaml_serde = "0.10"
serde = { version = "1", features = ["derive"] }
# Required by the hdk_entry_helper macro expansion. Version taken from hdi 0.8.0.
holochain_serialized_bytes = "=0.0.57"
# "encoding" gives AgentPubKey <-> base64 string, so DNA properties can hold a
# founder key as YAML-safe text rather than raw bytes.
holo_hash = { version = "0.7.0", features = ["encoding"] }
# The cipher the circle's own content is locked with.
#
# Not a preference — a necessity. Holochain's keystore locks data for you, but
# every request to it goes through a channel with an 8 KiB limit on one message
# (lair_keystore_api 0.7.1, sodium_secretstream.rs: `const MAX_FRAME`), and a
# full-length record is far bigger than that, let alone a photograph. So the
# keystore locks a short key and this locks the content with it — the ordinary
# way large data is encrypted, and what Holochain's own notes point at when they
# say to encrypt large data in chunks.
#
# Default features off: they pull in a random number generator, and the random
# bytes here come from Holochain's own host function instead.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
