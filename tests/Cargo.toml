[package]
name = "hearth-tests"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]

[dev-dependencies]
# default features include "encryption", which pulls SQLCipher and then a
# vendored OpenSSL build. That needs a perl toolchain Windows does not have.
# "sweettest" is the supported feature for this kind of test.
holochain = { version = "0.7.0", default-features = false, features = ["sweettest", "schema", "wasmer-sys-cranelift"] }
holochain_types = "0.7.0"
holochain_zome_types = "0.7.0"
hdk = "0.7.0"
aboutme_integrity = { path = "../dnas/aboutme/zomes/integrity/aboutme" }
aboutme = { path = "../dnas/aboutme/zomes/coordinator/aboutme" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
