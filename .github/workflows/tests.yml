name: tests

# The adversarial suite cannot run on Windows: holochain_keystore pulls
# lair_keystore with SQLCipher and a vendored OpenSSL build, which needs a full
# Perl toolchain that Git for Windows does not ship. Linux has it as standard,
# so the rules are verified here on every push instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  HOLOCHAIN_VERSION: 0.7.0

jobs:
  # Does the test suite still compile?
  #
  # Its own job, on purpose, and for two reasons.
  #
  # It cannot be answered on the machine this is written on — the test crate
  # pulls a vendored OpenSSL that needs a Perl toolchain Windows does not ship
  # — so CI is the first compiler ever to see a change to these tests. That
  # makes the round trip the slowest part of changing them.
  #
  # And in the job below, everything after the freeze check is skipped when the
  # freeze check fails. So a test that would not compile could sit behind an
  # unrelated red step, invisible, for as many pushes as it took to notice. It
  # did: two runs were spent that way on 2026-09-10.
  #
  # Separate, and first, means a compile error comes back in minutes and never
  # hides behind something else.
  # Everything Hearth is built on, checked against the public list of known
  # security problems in Rust packages (RustSec). Asked for by an outside
  # review, 23 September 2026. It reports and does not block: most of what it
  # finds will be deep in Holochain, where the fix is Holochain's to make, and
  # a check that stops every release for somebody else's problem gets switched
  # off. Read its output; do not ignore a red one.
  dependencies:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: The zomes — what ships in every circle
        run: cargo audit --file Cargo.lock
      - name: The test harness
        if: always()
        run: cargo audit --file tests/Cargo.lock

  it-compiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/target
          key: ${{ runner.os }}-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-check-

      # --tests, so the test code itself is type-checked and not just the
      # library it sits on. No codegen, no linking, and nothing is run: this
      # answers "does it compile" and nothing else, which is the question that
      # was taking half an hour to answer.
      - name: The adversarial suite compiles
        working-directory: tests
        run: cargo check --tests

  adversarial:
    runs-on: ubuntu-latest
    # Three runners, each taking every third test. The whole suite in one run
    # passed two hours in September 2026, because the tests on two devices wait
    # on real gossip, and a run that long was stopped part-way through with
    # nothing failed. Every other step repeats on each runner; only the tests
    # are divided.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4

      # Not @stable. rust-toolchain.toml pins the compiler because the DNA
      # hash is computed over the wasm it produces, and a different compiler
      # means a different network. CI must build what everybody else builds,
      # or it is testing something nobody is running.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tests/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Through the wrapper, not cargo. It strips the building machine's
      # paths out of the wasm, without which every machine produces a
      # different DNA hash and the pin below could never hold.
      - name: Build zomes
        run: node scripts/build-zomes.mjs

      # Pure logic that cannot be exercised through a conductor — chiefly
      # `order_versions`, where a timestamp collision cannot be provoked on
      # demand. Runs natively and in seconds.
      - name: Unit tests
        run: cargo test -p aboutme_integrity

      # Same flags as the wrapper. Setting RUSTFLAGS replaces the config's own
      # flags rather than adding to them, so they have to be repeated — see the
      # comment at the top of scripts/build-zomes.mjs. The remapping is left
      # out deliberately: it only affects the compiled bytes, and nothing here
      # is kept.
      - name: Clippy
        env:
          RUSTFLAGS: -C link-arg=--import-undefined --cfg getrandom_backend="custom"
        run: cargo clippy --target wasm32-unknown-unknown --workspace -- -D warnings

      # The coordinator zome only, and deliberately not the whole workspace.
      #
      # The integrity zome is frozen: reformatting it would change the compiled
      # bytes and strand every circle in existence. It happens to be formatted
      # correctly, but checking it here would mean that if it ever were not, CI
      # would demand a change the freeze forbids — a rule that cannot be
      # obeyed. So it is left out, and the freeze check below is what guards
      # that file.
      - name: Formatting
        run: cargo fmt -p aboutme --check

      # 2,200 lines of JavaScript with no build step to catch a typo in it.
      # This is not a linter; it is the difference between a syntax error found
      # here and one found by somebody opening the app.
      - name: The interface parses
        run: |
          for f in ui/src/main.js ui/scripts/*.mjs scripts/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done

      # Markup that is not the shape it looks like. A section lost its opening
      # tag in a refactor and swallowed the one after it; every id was still
      # present exactly once, every button still had a listener, and browsers
      # render it happily — so nothing noticed but a screen behaving oddly.
      - name: The page is the shape it looks
        working-directory: ui
        run: node scripts/the-page-is-the-shape-it-looks.mjs

      # A button that does nothing is worse than no button: it gets pressed,
      # and then pressed again. One went dead in a refactor — the line wiring
      # it found the buttons by class, so it had no id in it, and every check
      # here looked straight past it while somebody sat on a screen with no
      # way back.
      - name: Every button does something
        working-directory: ui
        run: node scripts/every-button-does-something.mjs

      # A door address is typed, written down and read out. On the first
      # offline test one wrong character was refused with nothing to say
      # where. Every address must read back to its room, and every wrong
      # letter or swapped pair must be caught in the row it is in.
      - name: Door addresses survive mistakes
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          node scripts/addresses-survive-mistakes.mjs

      # The frozen integrity zome must not move.
      #
      # A circle is the hash of this wasm, so any change to it strands every
      # circle in existence, silently, with no error shown to anybody. The
      # freeze is a promise; this step is what makes it more than one.
      # See dnas/aboutme/zomes/integrity/aboutme/FROZEN.sha256.
      - name: The integrity zome is frozen
        run: |
          pin_file=dnas/aboutme/zomes/integrity/aboutme/FROZEN.sha256
          expected=$(grep '^linux' "$pin_file" | awk '{print $2}')
          actual=$(sha256sum target/wasm32-unknown-unknown/release/aboutme_integrity.wasm | awk '{print $1}')

          if [ "$expected" = "UNKNOWN-until-the-first-CI-run" ]; then
            echo "::error::The Linux hash has never been recorded. It is:"
            echo "::error::  $actual"
            echo "::error::Put that on the 'linux' line of $pin_file and push."
            exit 1
          fi

          if [ "$expected" != "$actual" ]; then
            echo "::error::THE INTEGRITY ZOME HAS CHANGED."
            echo "::error::  expected  $expected"
            echo "::error::  built     $actual"
            echo "::error::"
            echo "::error::Every circle anybody has made is unreachable to this build."
            echo "::error::If it was accidental - a comment, a reformat, a tidy-up - revert it."
            echo "::error::If it is deliberate it is a migration: see docs/to-a-product.md,"
            echo "::error::and update $pin_file in the same commit."
            exit 1
          fi

          echo "Integrity zome unchanged: $actual"

      - name: Fetch the hc CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          gh release download "holochain-${HOLOCHAIN_VERSION}" \
            --repo holochain/holochain \
            --pattern "hc-x86_64-unknown-linux-gnu" \
            --output bin/hc
          chmod +x bin/hc
          ./bin/hc --version

      - name: Pack the DNA and hApp
        run: |
          ./bin/hc dna pack dnas/aboutme/workdir
          ./bin/hc app pack workdir

      # Every rule this project claims is a rule only if something rejects when
      # it is broken.
      - name: Run the adversarial suite
        working-directory: tests
        run: |
          names=$(cargo test --test adversarial -- --list --format=terse 2>/dev/null             | sed -n "s/: test$//p" | sort)
          mine=$(echo "$names" | awk -v shard=${{ matrix.shard }} "(NR - 1) % 3 == shard")
          echo "This runner takes $(echo "$mine" | wc -l) of $(echo "$names" | wc -l) tests."
          if [ -z "$mine" ]; then echo "::error::No tests found for this runner"; exit 1; fi
          cargo test --test adversarial -- --nocapture --test-threads=2 --exact $mine
