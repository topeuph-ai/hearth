name: tests

# The adversarial suite cannot run on Windows: holochain_keystore pulls
# lair_keystore with SQLCipher and a vendored OpenSSL build, which needs a full
# Perl toolchain that Git for Windows does not ship. Linux has it as standard,
# so the rules are verified here on every push instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  HOLOCHAIN_VERSION: 0.7.0

jobs:
  adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Not @stable. rust-toolchain.toml pins the compiler because the DNA
      # hash is computed over the wasm it produces, and a different compiler
      # means a different network. CI must build what everybody else builds,
      # or it is testing something nobody is running.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tests/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build zomes
        run: cargo build --target wasm32-unknown-unknown --release

      # Pure logic that cannot be exercised through a conductor — chiefly
      # `order_versions`, where a timestamp collision cannot be provoked on
      # demand. Runs natively and in seconds.
      - name: Unit tests
        run: cargo test -p aboutme_integrity

      # The frozen integrity zome must not move.
      #
      # A circle is the hash of this wasm, so any change to it strands every
      # circle in existence, silently, with no error shown to anybody. The
      # freeze is a promise; this step is what makes it more than one.
      # See dnas/aboutme/zomes/integrity/aboutme/FROZEN.sha256.
      - name: The integrity zome is frozen
        run: |
          pin_file=dnas/aboutme/zomes/integrity/aboutme/FROZEN.sha256
          expected=$(grep '^linux' "$pin_file" | awk '{print $2}')
          actual=$(sha256sum target/wasm32-unknown-unknown/release/aboutme_integrity.wasm | awk '{print $1}')

          if [ "$expected" = "UNKNOWN-until-the-first-CI-run" ]; then
            echo "::error::The Linux hash has never been recorded. It is:"
            echo "::error::  $actual"
            echo "::error::Put that on the 'linux' line of $pin_file and push."
            exit 1
          fi

          if [ "$expected" != "$actual" ]; then
            echo "::error::THE INTEGRITY ZOME HAS CHANGED."
            echo "::error::  expected  $expected"
            echo "::error::  built     $actual"
            echo "::error::"
            echo "::error::Every circle anybody has made is unreachable to this build."
            echo "::error::If it was accidental - a comment, a reformat, a tidy-up - revert it."
            echo "::error::If it is deliberate it is a migration: see docs/to-a-product.md,"
            echo "::error::and update $pin_file in the same commit."
            exit 1
          fi

          echo "Integrity zome unchanged: $actual"

      - name: Fetch the hc CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          gh release download "holochain-${HOLOCHAIN_VERSION}" \
            --repo holochain/holochain \
            --pattern "hc-x86_64-unknown-linux-gnu" \
            --output bin/hc
          chmod +x bin/hc
          ./bin/hc --version

      - name: Pack the DNA and hApp
        run: |
          ./bin/hc dna pack dnas/aboutme/workdir
          ./bin/hc app pack workdir

      # Every rule this project claims is a rule only if something rejects when
      # it is broken.
      - name: Run the adversarial suite
        working-directory: tests
        run: cargo test --test adversarial -- --nocapture --test-threads=2
