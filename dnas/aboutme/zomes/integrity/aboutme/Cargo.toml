[package]
name = "aboutme_integrity"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
name = "aboutme_integrity"

[dependencies]
hdi = { workspace = true }
serde = { workspace = true }
holochain_serialized_bytes = { workspace = true }
holo_hash = { workspace = true }
# Media is stored as raw bytes. Without this, serde writes a byte array as a
# list of numbers, which costs about a third more on every member's disk.
serde_bytes = "0.11"
